<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
    <!-- Background -->
    <rect width="600" height="400" rx="16" fill="#1e293b"/>
    
    <!-- Container -->
    <rect x="20" y="20" width="560" height="360" rx="12" fill="#0f172a"/>
    
    <!-- Judul Preview -->
    <text x="300" y="55" fill="#94a3b8" font-size="14" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold">📸 PREVIEW OCR</text>
    
    <!-- Status Badge -->
    <rect x="460" y="40" width="100" height="24" rx="12" fill="#22c55e" opacity="0.3"/>
    <circle cx="475" cy="52" r="4" fill="#22c55e"/>
    <text x="485" y="56" fill="#22c55e" font-size="11" font-family="Arial, sans-serif">Active</text>
    
    <!-- ===== COVER BUKU (Kiri) ===== -->
    <rect x="40" y="75" width="220" height="280" rx="6" fill="#1e293b"/>
    <rect x="40" y="75" width="220" height="280" rx="6" fill="none" stroke="#334155" stroke-width="2"/>
    
    <!-- Sampul Buku -->
    <rect x="55" y="90" width="190" height="250" rx="4" fill="#3b82f6"/>
    
    <!-- Judul Buku di Cover -->
    <text x="150" y="160" fill="white" font-size="18" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold">BUKU</text>
    <text x="150" y="190" fill="#bfdbfe" font-size="14" font-family="Arial, sans-serif" text-anchor="middle">Pemrograman</text>
    <text x="150" y="212" fill="#bfdbfe" font-size="14" font-family="Arial, sans-serif" text-anchor="middle">Web</text>
    
    <!-- Garis dekoratif -->
    <line x1="80" y1="235" x2="220" y2="235" stroke="#93c5fd" stroke-width="1" opacity="0.5"/>
    
    <!-- Pengarang -->
    <text x="150" y="260" fill="#93c5fd" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">Dr. Andi</text>
    
    <!-- Penerbit -->
    <text x="150" y="285" fill="#93c5fd" font-size="10" font-family="Arial, sans-serif" text-anchor="middle">PENS Press</text>
    
    <!-- ISBN -->
    <rect x="80" y="305" width="140" height="22" rx="3" fill="#2563eb"/>
    <text x="150" y="320" fill="white" font-size="9" font-family="Arial, sans-serif" text-anchor="middle">ISBN: 978-602-xxx</text>
    
    <!-- ===== HASIL OCR (Kanan) ===== -->
    <rect x="290" y="75" width="270" height="280" rx="6" fill="#1e293b"/>
    <rect x="290" y="75" width="270" height="280" rx="6" fill="none" stroke="#334155" stroke-width="2"/>
    
    <!-- Judul Hasil -->
    <text x="310" y="105" fill="#e2e8f0" font-size="13" font-family="Arial, sans-serif" font-weight="bold">📋 Hasil Ekstraksi</text>
    
    <!-- Garis pemisah -->
    <line x1="310" y1="115" x2="540" y2="115" stroke="#334155" stroke-width="1"/>
    
    <!-- Field Metadata -->
    <!-- Judul -->
    <text x="310" y="140" fill="#94a3b8" font-size="11" font-family="Arial, sans-serif">Judul</text>
    <text x="310" y="158" fill="#e2e8f0" font-size="13" font-family="Arial, sans-serif" font-weight="bold">Pemrograman Web</text>
    <line x1="310" y1="168" x2="540" y2="168" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Pengarang -->
    <text x="310" y="190" fill="#94a3b8" font-size="11" font-family="Arial, sans-serif">Pengarang</text>
    <text x="310" y="208" fill="#e2e8f0" font-size="13" font-family="Arial, sans-serif">Dr. Andi</text>
    <line x1="310" y1="218" x2="540" y2="218" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Penerbit -->
    <text x="310" y="240" fill="#94a3b8" font-size="11" font-family="Arial, sans-serif">Penerbit</text>
    <text x="310" y="258" fill="#e2e8f0" font-size="13" font-family="Arial, sans-serif">PENS Press</text>
    <line x1="310" y1="268" x2="540" y2="268" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Tahun -->
    <text x="310" y="290" fill="#94a3b8" font-size="11" font-family="Arial, sans-serif">Tahun</text>
    <text x="310" y="308" fill="#e2e8f0" font-size="13" font-family="Arial, sans-serif">2024</text>
    <line x1="310" y1="318" x2="540" y2="318" stroke="#1e293b" stroke-width="1"/>
    
    <!-- ISBN -->
    <text x="310" y="340" fill="#94a3b8" font-size="11" font-family="Arial, sans-serif">ISBN</text>
    <text x="310" y="358" fill="#e2e8f0" font-size="13" font-family="Arial, sans-serif">978-602-xxx</text>
    
    <!-- ===== IKON PROSES ===== -->
    <!-- Panah dari cover ke hasil -->
    <text x="270" y="200" fill="#64748b" font-size="24" font-family="Arial, sans-serif">→</text>
    
    <!-- Loading indicator di hasil -->
    <circle cx="540" cy="50" r="8" fill="none" stroke="#3b82f6" stroke-width="2">
        <animate attributeName="stroke-dasharray" from="0 50" to="50 50" dur="1s" repeatCount="indefinite"/>
    </circle>
</svg>